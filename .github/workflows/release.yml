name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build executable
        run: pyinstaller --noconfirm "PDF Blade.spec"

      - name: Rename artifact
        shell: pwsh
        run: Move-Item -LiteralPath "dist\PDF Blade.exe" -Destination "dist\PDF-Blade-windows-x64.exe"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist\PDF-Blade-windows-x64.exe" --generate-notes --title "PDF Blade ${{ github.ref_name }}"
